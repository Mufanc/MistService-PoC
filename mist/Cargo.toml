[workspace]
members = ["daemon", "library"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
android_logger = "0.15"
async-trait = "0.1"
anyhow = "1"
clap = { version = "4" }
env_logger = "0.11"
log = "0.4"
memfd = "0.6"
memmap2 = "0.9"
nix = { version = "0.31" }
once_map = "0.4"
paste = "1.0"
procfs = "0.18"
r3solvr = { git = "https://github.com/Mufanc/r3solvr" }
rsbinder = "0.6"
rsbinder-aidl = "0.6"
scopeguard = "1.2"
syscalls = "0.8"
uds = "0.4"
wisp = { git = "https://github.com/Mufanc/wisp" }
