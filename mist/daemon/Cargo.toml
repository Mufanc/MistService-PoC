[package]
name = "daemon"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mist"
path = "src/main.rs"

[dependencies]
android_logger = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
env_logger = { workspace = true }
log = { workspace = true }
memfd = { workspace = true }
memmap2 = { workspace = true }
nix = { workspace = true, features = ["ptrace", "signal", "socket", "uio"] }
once_map = { workspace = true }
paste = { workspace = true }
procfs = { workspace = true }
r3solvr = { workspace = true }
rsbinder = { workspace = true, features = ["android_13", "android_14", "android_16"] }
scopeguard = { workspace = true }
syscalls = { workspace = true }
uds = { workspace = true }

[build-dependencies]
rsbinder-aidl = { workspace = true }
